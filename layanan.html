<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Data Siswa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f8;
    }
  </style>
</head>
<body class="p-4 sm:p-6 md:p-8 min-h-screen text-slate-700">

  <div class="max-w-6xl mx-auto space-y-6">

    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80">
      <div class="flex items-center gap-3 mb-6">
        <i class="fa-solid fa-user-plus text-slate-600 text-xl"></i>
        <h2 id="formTitle" class="text-lg font-bold text-slate-800">Tambah Data Siswa</h2>
      </div>
      <form id="studentForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="editIndex" value="-1">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">
          <div class="space-y-5">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">NIS</label>
              <input type="text" id="inputNis" required placeholder="Masukkan NIS" 
                     class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition placeholder:text-slate-400">
            </div>

            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">Nama Lengkap</label>
              <input type="text" id="inputNama" required placeholder="Masukkan nama lengkap" 
                     class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition placeholder:text-slate-400">
            </div>

            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">Kelas</label>
              <select id="inputKelas" required 
                      class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-slate-700 bg-white">
                <option value="" disabled selected hidden>Pilih kelas</option>
                <option value="X RPL 1">X RPL 1</option>
                <option value="X RPL 2">X RPL 2</option>
                <option value="X RPL 3">X RPL 3</option>
                <option value="XI RPL 1">XI RPL 1</option>
                <option value="XI RPL 2">XI RPL 2</option>
              </select>
            </div>
          </div>
          <div class="space-y-5">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">Jenis Kelamin</label>
              <div class="flex items-center gap-8 pt-2">
                <label class="inline-flex items-center gap-2.5 cursor-pointer text-sm font-medium text-slate-700">
                  <input type="radio" name="jenisKelamin" value="Laki-laki" checked class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-slate-300">
                  <span>Laki-laki</span>
                </label>
                <label class="inline-flex items-center gap-2.5 cursor-pointer text-sm font-medium text-slate-700">
                  <input type="radio" name="jenisKelamin" value="Perempuan" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-slate-300">
                  <span>Perempuan</span>
                </label>
              </div>
            </div>

            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">Tanggal Lahir</label>
              <div class="relative">
                <input type="date" id="inputTanggalLahir" required 
                       class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-slate-700">
              </div>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-3 mt-6 pt-2">
          <button type="submit" id="submitBtn" 
                  class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-5 py-2.5 rounded-lg transition shadow-sm">
            <i class="fa-solid fa-plus text-xs" id="submitIcon"></i>
            <span id="submitText">Simpan</span>
          </button>

          <button type="button" onclick="resetForm()" 
                  class="inline-flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 font-medium text-sm px-4 py-2.5 rounded-lg border border-slate-200 transition">
            <i class="fa-solid fa-rotate text-xs text-slate-500"></i>
            <span>Reset</span>
          </button>
        </div>
      </form>
    </div>

    <!-- CARD 2: TABEL DATA SISWA -->
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80">
      <!-- Header Table & Search Input -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-list-ul text-slate-600 text-xl"></i>
          <h2 class="text-lg font-bold text-slate-800">Data Siswa</h2>
        </div>

        <!-- Search Bar -->
        <div class="relative w-full sm:w-72">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
            <i class="fa-solid fa-magnifying-glass text-sm"></i>
          </span>
          <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Cari nama atau NIS..." 
                 class="w-full pl-9 pr-4 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition placeholder:text-slate-400">
        </div>
      </div>

      <!-- Data Table -->
      <div class="overflow-x-auto rounded-xl border border-slate-100">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50/70 border-b border-slate-200/80 text-xs font-bold text-slate-700">
              <th class="py-3.5 px-4 w-12 text-center">No</th>
              <th class="py-3.5 px-4">NIS</th>
              <th class="py-3.5 px-4">Nama Lengkap</th>
              <th class="py-3.5 px-4">Kelas</th>
              <th class="py-3.5 px-4">Jenis Kelamin</th>
              <th class="py-3.5 px-4">Tanggal Lahir</th>
              <th class="py-3.5 px-4 text-center w-28">Aksi</th>
            </tr>
          </thead>
          <tbody id="studentTableBody" class="divide-y divide-slate-100 text-sm">
            <!-- Table rows will be populated by JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- Table Footer / Pagination -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mt-6 pt-2 text-sm text-slate-500">
        <div id="paginationInfo">
          Menampilkan 1 - 5 dari 5 data
        </div>

        <div class="flex items-center gap-1.5">
          <button class="w-8 h-8 flex items-center justify-center rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-400 transition">
            <i class="fa-solid fa-chevron-left text-xs"></i>
          </button>
          <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-indigo-600 text-white font-medium shadow-sm">
            1
          </button>
          <button class="w-8 h-8 flex items-center justify-center rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-400 transition">
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
        </div>
      </div>

    </div>

  </div>

  <!-- JavaScript Logic -->
  <script>
    // Data Siswa Awal (Sesuai Gambar)
    let studentsData = [
      { nis: "001", nama: "Andi Setiawan", kelas: "X RPL 1", gender: "Laki-laki", tanggalLahir: "2008-01-15" },
      { nis: "002", nama: "Budi Santoso", kelas: "X RPL 1", gender: "Laki-laki", tanggalLahir: "2008-03-22" },
      { nis: "003", nama: "Citra Lestari", kelas: "X RPL 2", gender: "Perempuan", tanggalLahir: "2008-07-10" },
      { nis: "004", nama: "Deni Pratama", kelas: "X RPL 2", gender: "Laki-laki", tanggalLahir: "2008-09-05" },
      { nis: "005", nama: "Eka Wijaya", kelas: "X RPL 3", gender: "Perempuan", tanggalLahir: "2008-11-18" }
    ];

    let filteredData = [...studentsData];

    // Fungsi Render Tabel
    function renderTable() {
      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = '';

      if (filteredData.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-6 text-center text-slate-400">
              Tidak ada data siswa ditemukan.
            </td>
          </tr>
        `;
      } else {
        filteredData.forEach((student, index) => {
          // Cari index asli di studentsData untuk aksi edit/delete
          const originalIndex = studentsData.findIndex(s => s.nis === student.nis);

          const row = document.createElement('tr');
          row.className = "hover:bg-slate-50/50 transition";
          row.innerHTML = `
            <td class="py-3.5 px-4 text-center font-medium text-slate-600">${index + 1}</td>
            <td class="py-3.5 px-4 text-slate-600">${student.nis}</td>
            <td class="py-3.5 px-4 font-semibold text-slate-800">${student.nama}</td>
            <td class="py-3.5 px-4 text-slate-600">${student.kelas}</td>
            <td class="py-3.5 px-4 text-slate-600">${student.gender}</td>
            <td class="py-3.5 px-4 text-slate-600">${student.tanggalLahir}</td>
            <td class="py-3.5 px-4 text-center">
              <div class="flex items-center justify-center gap-2">
                <button onclick="editStudent(${originalIndex})" 
                        class="w-8 h-8 flex items-center justify-center rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white transition">
                  <i class="fa-solid fa-pen text-xs"></i>
                </button>
                <button onclick="deleteStudent(${originalIndex})" 
                        class="w-8 h-8 flex items-center justify-center rounded-lg bg-rose-500 hover:bg-rose-600 text-white transition">
                  <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
              </div>
            </td>
          `;
          tbody.appendChild(row);
        });
      }

      // Update Teks Informasi Pagination
      const total = filteredData.length;
      const countText = total > 0 ? `Menampilkan 1 - ${total} dari ${total} data` : `Menampilkan 0 dari 0 data`;
      document.getElementById('paginationInfo').innerText = countText;
    }

    // Submit Handler (Tambah / Update)
    function handleFormSubmit(e) {
      e.preventDefault();

      const editIdx = parseInt(document.getElementById('editIndex').value);
      const nis = document.getElementById('inputNis').value.trim();
      const nama = document.getElementById('inputNama').value.trim();
      const kelas = document.getElementById('inputKelas').value;
      const gender = document.querySelector('input[name="jenisKelamin"]:checked').value;
      const tanggalLahir = document.getElementById('inputTanggalLahir').value;

      const newStudent = { nis, nama, kelas, gender, tanggalLahir };

      if (editIdx === -1) {
        
        studentsData.push(newStudent);
      } else {
       
        studentsData[editIdx] = newStudent;
      }

      resetForm();
      handleSearch();
    }

   
    function resetForm() {
      document.getElementById('studentForm').reset();
      document.getElementById('editIndex').value = "-1";
      document.getElementById('formTitle').innerText = "Tambah Data Siswa";
      document.getElementById('submitText').innerText = "Simpan";
      document.getElementById('submitIcon').className = "fa-solid fa-plus text-xs";
    }

    
    function editStudent(index) {
      const student = studentsData[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('inputNis').value = student.nis;
      document.getElementById('inputNama').value = student.nama;
      document.getElementById('inputKelas').value = student.kelas;
      document.getElementById('inputTanggalLahir').value = student.tanggalLahir;

      const genderRadios = document.querySelectorAll('input[name="jenisKelamin"]');
      genderRadios.forEach(radio => {
        if (radio.value === student.gender) {
          radio.checked = true;
        }
      });

      document.getElementById('formTitle').innerText = "Edit Data Siswa";
      document.getElementById('submitText').innerText = "Update";
      document.getElementById('submitIcon').className = "fa-solid fa-check text-xs";

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteStudent(index) {
      studentsData.splice(index, 1);
      handleSearch();
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      filteredData = studentsData.filter(student => 
        student.nama.toLowerCase().includes(query) || 
        student.nis.toLowerCase().includes(query)
      );
      renderTable();
    }
    window.onload = function() {
      renderTable();
    };
  </script>
</body>
</html>
